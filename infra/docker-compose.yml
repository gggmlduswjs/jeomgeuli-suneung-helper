version: '3.8'

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../api:/app
    environment:
      - DATABASE_URL=sqlite:///./data/db.sqlite3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  data:
