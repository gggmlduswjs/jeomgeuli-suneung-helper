services:
  # Backend API Service (Python FastAPI)
  - type: web
    name: jeomgeuli-backend
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false  # Render 대시보드에서 PostgreSQL 데이터베이스 생성 후 설정
      - key: OPENAI_API_KEY
        sync: false  # OpenAI API 키를 Render 대시보드에서 설정
      - key: CORS_ORIGINS
        value: https://jeomgeuli-frontend.onrender.com,http://localhost:5173,http://localhost:3000
      - key: MATHPIX_APP_ID
        sync: false  # 선택사항: MathPix API 사용 시
      - key: MATHPIX_APP_KEY
        sync: false  # 선택사항: MathPix API 사용 시
      - key: ROBOFLOW_API_KEY
        sync: false  # 선택사항: Roboflow API 사용 시
      - key: ROBOFLOW_WORKSPACE_ID
        sync: false  # 선택사항: Roboflow API 사용 시
      - key: ROBOFLOW_PROJECT_ID
        sync: false  # 선택사항: Roboflow API 사용 시
    disk:
      name: backend-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 10

  # Frontend Static Site
  - type: web
    name: jeomgeuli-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend 서비스 URL (Backend 배포 후 자동으로 생성된 URL로 변경)
      - key: VITE_API_BASE_URL
        sync: false  # Backend 배포 후 URL을 수동으로 설정하세요 (예: https://jeomgeuli-backend.onrender.com/api/v1)
