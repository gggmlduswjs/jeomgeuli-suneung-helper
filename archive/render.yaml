services:
  # Backend API Service (Python 네이티브 환경)
  - type: web
    name: jeomgeuli-backend
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false  # Set this in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: MATHPIX_APP_ID
        sync: false  # Optional
      - key: MATHPIX_APP_KEY
        sync: false  # Optional
      - key: ROBOFLOW_API_KEY
        sync: false  # Optional
      - key: ROBOFLOW_WORKSPACE_ID
        sync: false  # Optional
      - key: ROBOFLOW_PROJECT_ID
        sync: false  # Optional
      - key: CORS_ORIGINS
        value: https://jeomgeuli-frontend.onrender.com,http://localhost:5173,http://localhost:3000
    disk:
      name: backend-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 10

  # Frontend Static Site
  - type: web
    name: jeomgeuli-frontend
    env: static
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite 환경 변수는 VITE_ 접두사 필요
      # Render 대시보드에서 Backend 서비스 URL로 수동 설정 필요
      # 예: https://jeomgeuli-backend.onrender.com
      - key: VITE_API_BASE_URL
        sync: false  # Backend 배포 후 URL을 수동으로 설정하세요
