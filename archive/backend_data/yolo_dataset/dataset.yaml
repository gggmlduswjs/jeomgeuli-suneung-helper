  2: passage       # 본문 영역 (문제를 풀기 위해 읽어야 하는 지문)
  3: question      # 문제 영역 (질문 + 선지)
  4: concept_box   # 개념박스 영역 (풀이 전략/개념 설명)
  5: sidebar       # 사이드바 영역 (부가 정보: 단어 뜻, 주석 등)

