# Render.com 배포 설정
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: jeomgeuli-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # PostgreSQL 서비스에서 자동으로 설정됨
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://your-frontend.onrender.com,http://localhost:5173
    healthCheckPath: /api/v1/health

databases:
  - name: jeomgeuli-db
    databaseName: jeomgeuli
    user: jeomgeuli
    plan: free  # 또는 starter, standard 등
